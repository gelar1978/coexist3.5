<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Password - Coexist3.5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .message.show { display: block; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
        .back-link:hover { color: #333; }
        .divider { border-top: 1px solid #e0e0e0; margin: 25px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Ubah Password</h1>
        <div class="subtitle">Ganti password akun Anda</div>
        
        <form id="changePasswordForm">
            <div class="form-group">
                <label>Password Saat Ini</label>
                <input type="password" id="currentPassword" required placeholder="Masukkan password lama">
            </div>
            <div class="form-group">
                <label>Password Baru (min 6 karakter)</label>
                <input type="password" id="newPassword" required placeholder="Buat password baru" minlength="6">
            </div>
            <div class="form-group">
                <label>Konfirmasi Password Baru</label>
                <input type="password" id="confirmPassword" required placeholder="Ulangi password baru" minlength="6">
            </div>
            <button type="submit" id="changeBtn">Ubah Password</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="divider"></div>
        <a href="/dashboard" class="back-link">← Kembali ke Dashboard</a>
    </div>

    <script>
        // Check user session
        async function checkUser() {
            try {
                const response = await fetch('/api/auth/me');
                const data = await response.json();
                if (!data.success) {
                    window.location.href = '/login.html';
                }
            } catch (err) {
                window.location.href = '/login.html';
            }
        }
        checkUser();

        const form = document.getElementById('changePasswordForm');
        const messageEl = document.getElementById('message');
        const btn = document.getElementById('changeBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            messageEl.className = 'message';
            messageEl.textContent = '';
            messageEl.style.display = 'none';
            
            if (newPassword.length < 6) {
                messageEl.className = 'message error show';
                messageEl.textContent = '❌ Password minimal 6 karakter';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                messageEl.className = 'message error show';
                messageEl.textContent = '❌ Password dan konfirmasi tidak cocok';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Memproses...';
            
            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentPassword, newPassword, confirmPassword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageEl.className = 'message success show';
                    messageEl.textContent = '✅ ' + data.message;
                    form.reset();
                    
                    // Redirect ke dashboard setelah 2 detik
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    messageEl.className = 'message error show';
                    messageEl.textContent = '❌ ' + data.message;
                }
            } catch (err) {
                messageEl.className = 'message error show';
                messageEl.textContent = '❌ Terjadi kesalahan koneksi';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ubah Password';
            }
        });
    </script>
</body>
</html>
