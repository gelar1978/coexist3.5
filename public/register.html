<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Coexist3.5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background Animasi */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            animation: rotateBg 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Floating Bubbles */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 15s infinite ease-in-out;
            z-index: 0;
        }

        .bubble:nth-child(1) {
            width: 200px;
            height: 200px;
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }

        .bubble:nth-child(2) {
            width: 150px;
            height: 150px;
            bottom: -30px;
            right: -30px;
            animation-delay: -5s;
        }

        .bubble:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 50%;
            left: 80%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(20px, 30px) scale(1.05); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 45px 40px;
            max-width: 460px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo/Icon */
        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 36px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
            font-weight: 400;
        }

        .subtitle span {
            color: #667eea;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-weight: 600;
            font-size: 13px;
        }

        .form-group label i {
            margin-right: 5px;
            color: #667eea;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper > i {
            position: absolute;
            left: 15px;
            color: #aaa;
            font-size: 15px;
            transition: color 0.3s;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 15px 13px 44px;
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            font-size: 14px;
            background: #f8f9fc;
            transition: all 0.3s;
            color: #333;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-wrapper input:focus ~ i {
            color: #667eea;
        }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            cursor: pointer;
            color: #aaa;
            transition: color 0.3s;
            background: none;
            border: none;
            font-size: 15px;
            padding: 0;
        }

        .input-wrapper .toggle-password:hover {
            color: #667eea;
        }

        /* Password strength */
        .strength-bar-wrap {
            height: 3px;
            border-radius: 3px;
            margin-top: 6px;
            background: #e8ecf1;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            border-radius: 3px;
            width: 0%;
            transition: all 0.4s ease;
        }

        .strength-bar.weak   { width: 25%; background: #dc3545; }
        .strength-bar.medium { width: 55%; background: #ffc107; }
        .strength-bar.strong { width: 100%; background: #28a745; }

        .btn-register {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-register .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-register.loading .spinner {
            display: block;
        }

        .btn-register.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            margin-top: 18px;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .message.show {
            display: flex;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message i {
            font-size: 17px;
            flex-shrink: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0 18px;
            color: #ccc;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider::before { margin-right: 15px; }
        .divider::after  { margin-left: 15px; }

        .auth-links {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .auth-links a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        .auth-links .login-link {
            background: #f0f2ff;
            padding: 9px 24px;
            border-radius: 20px;
            font-weight: 600;
        }

        .auth-links .login-link:hover {
            background: #e0e4ff;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #f0f0f0;
            color: #bbb;
            font-size: 12px;
        }

        .footer span {
            color: #667eea;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 22px;
            }

            .logo-icon {
                width: 62px;
                height: 62px;
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Bubbles -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1>Buat Akun Baru</h1>
            <p class="subtitle">Bergabung dengan <span>Coexist3.5</span></p>
        </div>

        <!-- Form Registrasi -->
        <form id="registerForm" autocomplete="off">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <div class="input-wrapper">
                    <input type="text" id="username" required placeholder="Pilih username unik Anda">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <div class="input-wrapper">
                    <input type="email" id="email" required placeholder="contoh@email.com">
                    <i class="fas fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password <small style="color:#aaa; font-weight:400">(min. 6 karakter)</small>
                </label>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="Buat password yang kuat" minlength="6">
                    <i class="fas fa-lock"></i>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', 'toggleIcon1')">
                        <i class="fas fa-eye" id="toggleIcon1"></i>
                    </button>
                </div>
                <div class="strength-bar-wrap">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-shield-alt"></i> Konfirmasi Password
                </label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" required placeholder="Ulangi password Anda">
                    <i class="fas fa-shield-alt"></i>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', 'toggleIcon2')">
                        <i class="fas fa-eye" id="toggleIcon2"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
                <span class="btn-text"><i class="fas fa-user-plus" style="margin-right:8px"></i>Daftar Sekarang</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div id="message" class="message"></div>

        <div class="divider">atau</div>

        <div class="auth-links">
            <a href="login.html" class="login-link">
                <i class="fas fa-sign-in-alt"></i> Sudah Punya Akun? Login
            </a>
        </div>

        <div class="footer">
            <i class="fas fa-shield-alt" style="margin-right:5px"></i>
            Aman & Terpercaya | <span>Coexist3.5 v1.0</span>
        </div>
    </div>

    <script>
        // ==================== TOGGLE PASSWORD ====================
        function togglePassword(fieldId, iconId) {
            const input = document.getElementById(fieldId);
            const icon  = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // ==================== PASSWORD STRENGTH ====================
        document.getElementById('password').addEventListener('input', function () {
            const val = this.value;
            const bar = document.getElementById('strengthBar');
            bar.className = 'strength-bar';
            if (val.length === 0) return;
            if (val.length < 6) {
                bar.classList.add('weak');
            } else if (val.length < 10) {
                bar.classList.add('medium');
            } else {
                bar.classList.add('strong');
            }
        });

        // ==================== REGISTRASI ====================
        const registerForm = document.getElementById('registerForm');
        const messageEl    = document.getElementById('message');
        const registerBtn  = document.getElementById('registerBtn');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username        = document.getElementById('username').value.trim();
            const email           = document.getElementById('email').value.trim();
            const password        = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Reset message
            messageEl.className = 'message';
            messageEl.innerHTML = '';
            messageEl.style.display = '';

            // Validasi
            if (!username || !email || !password || !confirmPassword) {
                showMsg('error', 'fa-exclamation-circle', 'Semua kolom wajib diisi!');
                return;
            }

            if (password !== confirmPassword) {
                showMsg('error', 'fa-times-circle', 'Konfirmasi password tidak cocok!');
                return;
            }

            if (password.length < 6) {
                showMsg('error', 'fa-times-circle', 'Password minimal 6 karakter!');
                return;
            }

            // Loading state
            registerBtn.disabled = true;
            registerBtn.classList.add('loading');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, confirmPassword })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        showMsg('success', 'fa-check-circle', data.message || 'Akun berhasil dibuat!');
                        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                        return;
                    } else {
                        showMsg('error', 'fa-times-circle', data.message || 'Pendaftaran gagal.');
                        registerBtn.disabled = false;
                        registerBtn.classList.remove('loading');
                        return;
                    }
                }
            } catch (err) {
                console.log('🌐 Mode Statis / GitHub Pages');
            }

            // Fallback statis (GitHub Pages) — simulasi sukses
            showMsg('success', 'fa-check-circle', `✅ Akun "${username}" berhasil dibuat! Mengalihkan ke halaman login...`);
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        });

        function showMsg(type, icon, text) {
            messageEl.className = `message ${type} show`;
            messageEl.style.display = 'flex';
            messageEl.innerHTML = `<i class="fas ${icon}"></i> ${text}`;

            registerBtn.disabled = false;
            registerBtn.classList.remove('loading');
        }

        // Auto-focus
        document.getElementById('username').focus();
    </script>
</body>

</html>
