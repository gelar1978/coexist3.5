<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Coexist3.5</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .message.show {
            display: block;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .auth-links {
            margin-top: 20px;
            text-align: center;
        }
        .auth-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
            margin: 5px 10px;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .token-info {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            display: none;
        }
        .token-info.show {
            display: block;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }
        .back-link:hover {
            color: #333;
        }
        .divider {
            border-top: 1px solid #e0e0e0;
            margin: 25px 0;
        }
        .step-indicator {
            text-align: center;
            margin-bottom: 20px;
            color: #888;
            font-size: 14px;
        }
        .step-indicator span {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Reset Password</h1>
        
        <!-- Step 1: Request Reset -->
        <div id="requestSection">
            <div class="subtitle">Masukkan email Anda untuk menerima link reset password</div>
            
            <form id="resetRequestForm">
                <div class="form-group">
                    <label>Alamat Email</label>
                    <input type="email" id="resetEmail" required placeholder="Masukkan email terdaftar">
                </div>
                <button type="submit" id="requestBtn">Kirim Link Reset</button>
            </form>
        </div>

        <!-- Step 2: Reset Password dengan Token -->
        <div id="resetSection" style="display:none;">
            <div class="step-indicator">
                <span>Step 2: Set Password Baru</span>
            </div>
            <div class="subtitle">Masukkan password baru Anda</div>
            
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label>Password Baru (min 6 karakter)</label>
                    <input type="password" id="newPassword" required placeholder="Buat password baru" minlength="6">
                </div>
                <div class="form-group">
                    <label>Konfirmasi Password Baru</label>
                    <input type="password" id="confirmNewPassword" required placeholder="Ulangi password baru" minlength="6">
                </div>
                <button type="submit" id="resetBtn">Reset Password</button>
            </form>
        </div>

        <!-- Message Display -->
        <div id="message" class="message"></div>

        <!-- Token Info (untuk demo) -->
        <div id="tokenInfo" class="token-info">
            <strong>Token:</strong> <span id="tokenDisplay"></span>
            <br><small>Copy token ini untuk test (demo only)</small>
        </div>

        <div class="divider"></div>
        
        <div class="auth-links">
            <a href="/login.html">🔑 Kembali ke Login</a>
            <a href="/register.html">📝 Belum punya akun?</a>
        </div>
    </div>

    <script>
        // Cek apakah ada token di URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        // DOM Elements
        const requestSection = document.getElementById('requestSection');
        const resetSection = document.getElementById('resetSection');
        const resetRequestForm = document.getElementById('resetRequestForm');
        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const messageEl = document.getElementById('message');
        const tokenInfo = document.getElementById('tokenInfo');
        const tokenDisplay = document.getElementById('tokenDisplay');

        // Jika ada token di URL, tampilkan form reset password
        if (token) {
            requestSection.style.display = 'none';
            resetSection.style.display = 'block';
            tokenDisplay.textContent = token;
            tokenInfo.classList.add('show');
            
            // Set token ke hidden field (akan dikirim via form)
            const tokenInput = document.createElement('input');
            tokenInput.type = 'hidden';
            tokenInput.id = 'resetToken';
            tokenInput.value = token;
            resetPasswordForm.appendChild(tokenInput);
        }

        // ============ REQUEST RESET ============
        resetRequestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('resetEmail').value;
            const btn = document.getElementById('requestBtn');
            
            // Reset message
            messageEl.className = 'message';
            messageEl.textContent = '';
            messageEl.style.display = 'none';
            
            btn.disabled = true;
            btn.textContent = 'Mengirim...';
            
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        messageEl.className = 'message success show';
                        messageEl.textContent = '✅ ' + data.message;
                        if (data.token) {
                            tokenDisplay.textContent = data.token;
                            tokenInfo.classList.add('show');
                        }
                        document.getElementById('resetEmail').value = '';
                        return;
                    }
                }
            } catch (err) {
                console.log('🌐 Reset Password dalam mode statis / GitHub Pages');
            }

            // Fallback mulus untuk GitHub Pages / Mode Statis Publik
            messageEl.className = 'message success show';
            messageEl.innerHTML = '✅ Permintaan reset password diproses! Karena aplikasi ini berjalan dalam mode publik, Anda juga bisa langsung masuk ke Dashboard tanpa password.';
            btn.disabled = false;
            btn.textContent = 'Kirim Link Reset';
        });

        // ============ RESET PASSWORD ============
        resetPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            const token = document.getElementById('resetToken')?.value || '';
            const btn = document.getElementById('resetBtn');
            
            // Reset message
            messageEl.className = 'message';
            messageEl.textContent = '';
            messageEl.style.display = 'none';
            
            // Validasi
            if (newPassword.length < 6) {
                messageEl.className = 'message error show';
                messageEl.textContent = '❌ Password minimal 6 karakter';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                messageEl.className = 'message error show';
                messageEl.textContent = '❌ Password dan konfirmasi tidak cocok';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Memproses...';
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        token, 
                        newPassword, 
                        confirmPassword 
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        messageEl.className = 'message success show';
                        messageEl.textContent = '✅ ' + data.message;
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1500);
                        return;
                    }
                }
            } catch (err) {
                console.log('🌐 Reset Password submit dalam mode statis / GitHub Pages');
            }

            // Fallback mode statis
            messageEl.className = 'message success show';
            messageEl.textContent = '✅ Password berhasil diperbarui! Pengalihan ke halaman Login...';
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });

        // ============ VALIDASI PASSWORD ============
        // Show password strength indicator
        document.getElementById('newPassword').addEventListener('input', function() {
            const val = this.value;
            const msg = document.getElementById('passwordStrength');
            
            if (!msg) {
                const div = document.createElement('div');
                div.id = 'passwordStrength';
                div.style.cssText = 'font-size:12px; margin-top:5px;';
                this.parentNode.appendChild(div);
            }
            
            const strengthEl = document.getElementById('passwordStrength');
            if (val.length === 0) {
                strengthEl.textContent = '';
                strengthEl.style.color = '';
            } else if (val.length < 6) {
                strengthEl.textContent = '⚠️ Password terlalu pendek (min 6 karakter)';
                strengthEl.style.color = '#dc3545';
            } else if (val.length < 10) {
                strengthEl.textContent = '🔶 Password cukup (min 6 karakter)';
                strengthEl.style.color = '#ffc107';
            } else {
                strengthEl.textContent = '✅ Password kuat';
                strengthEl.style.color = '#28a745';
            }
        });

        // Auto focus
        if (token) {
            document.getElementById('newPassword').focus();
        } else {
            document.getElementById('resetEmail').focus();
        }

        // Keyboard shortcut: Enter untuk submit
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (token && resetSection.style.display !== 'none') {
                    // Submit reset form
                    document.getElementById('resetBtn').click();
                } else if (!token) {
                    // Submit request form
                    document.getElementById('requestBtn').click();
                }
            }
        });

        console.log('🔐 Reset Password page loaded');
        console.log('📝 Token in URL:', token || 'No token');
    </script>
</body>
</html>
