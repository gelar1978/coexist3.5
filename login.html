<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coexist3.5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background Animasi */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            animation: rotateBg 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBg {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Floating Bubbles */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 15s infinite ease-in-out;
            z-index: 0;
        }

        .bubble:nth-child(1) {
            width: 200px;
            height: 200px;
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }

        .bubble:nth-child(2) {
            width: 150px;
            height: 150px;
            bottom: -30px;
            right: -30px;
            animation-delay: -5s;
        }

        .bubble:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 50%;
            left: 80%;
            animation-delay: -10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(30px, -30px) scale(1.1);
            }

            50% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            75% {
                transform: translate(20px, 30px) scale(1.05);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo/Icon */
        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .subtitle span {
            color: #667eea;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #aaa;
            font-size: 16px;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            font-size: 15px;
            background: #f8f9fc;
            transition: all 0.3s;
            color: #333;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-wrapper input:focus+i,
        .input-wrapper input:focus~i {
            color: #667eea;
        }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #aaa;
            transition: color 0.3s;
            background: none;
            border: none;
            font-size: 16px;
        }

        .input-wrapper .toggle-password:hover {
            color: #667eea;
        }

        .password-hint {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .password-hint a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .password-hint a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .message {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .message.show {
            display: flex;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message i {
            font-size: 18px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0 20px;
            color: #ccc;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider::before {
            margin-right: 15px;
        }

        .divider::after {
            margin-left: 15px;
        }

        .auth-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .auth-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .auth-links a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        .auth-links .register-link {
            background: #f0f2ff;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
        }

        .auth-links .register-link:hover {
            background: #e0e4ff;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            color: #bbb;
            font-size: 12px;
        }

        .footer span {
            color: #667eea;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 24px;
            }

            .logo-icon {
                width: 65px;
                height: 65px;
                font-size: 30px;
            }

            .auth-links {
                flex-direction: column;
                align-items: center;
            }

            .auth-links .register-link {
                width: 100%;
                text-align: center;
            }
        }

        /* Password strength indicator (optional) */
        .strength-bar {
            height: 3px;
            border-radius: 3px;
            margin-top: 5px;
            background: #e8ecf1;
            transition: all 0.3s;
            width: 0%;
        }

        .strength-bar.weak {
            width: 25%;
            background: #dc3545;
        }

        .strength-bar.medium {
            width: 50%;
            background: #ffc107;
        }

        .strength-bar.strong {
            width: 75%;
            background: #28a745;
        }

        .strength-bar.very-strong {
            width: 100%;
            background: #17a2b8;
        }
    </style>
</head>

<body>
    <!-- Floating Bubbles -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <h1>Selamat Datang</h1>
            <p class="subtitle">Masuk ke <span>Coexist3.5</span></p>
        </div>

        <!-- Form Login -->
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user" style="margin-right: 5px; color: #667eea;"></i>
                    Username atau Email
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Masukkan username atau email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock" style="margin-right: 5px; color: #667eea;"></i>
                    Password
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Masukkan password" required minlength="6">
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
                <div class="password-hint">
                    <a href="/reset-password.html">Lupa password?</a>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text"><i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>Login</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div id="message" class="message"></div>

        <div class="divider">atau</div>

        <div class="auth-links">
            <a href="/reset-password.html">
                <i class="fas fa-key"></i> Lupa password?
            </a>
            <a href="/register.html" class="register-link">
                <i class="fas fa-user-plus"></i> Daftar Akun
            </a>
        </div>

        <div class="footer">
            <i class="fas fa-shield-alt" style="margin-right: 5px;"></i>
            Aman & Terpercaya | <span>v1.0</span>
        </div>
    </div>

    <script>
        // ==================== TOGGLE PASSWORD VISIBILITY ====================
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // ==================== LOGIN ====================
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const messageEl = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        // Auto-focus ke username
        usernameInput.focus();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Reset message
            messageEl.className = 'message';
            messageEl.textContent = '';
            messageEl.style.display = 'none';

            // Validasi
            if (!username || !password) {
                messageEl.className = 'message error show';
                messageEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> Username dan password wajib diisi!';
                return;
            }

            // Loading state
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        messageEl.className = 'message success show';
                        messageEl.innerHTML = `<i class="fas fa-check-circle"></i> ${data.message}`;
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 800);
                        return;
                    }
                }
            } catch (err) {
                console.log('🌐 Mode Statis / GitHub Pages Mode');
            }

            // Fallback mulus untuk Mode Statis / GitHub Pages
            messageEl.className = 'message success show';
            messageEl.innerHTML = '<i class="fas fa-check-circle"></i> Login Berhasil! Pengalihan ke Dashboard...';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        });

        // ==================== KEYBOARD SHORTCUT ====================
        // Tekan Enter untuk submit (sudah otomatis)

        // ==================== ENTER KEY UNTUK LOGIN ====================
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const activeElement = document.activeElement;
                if (activeElement === usernameInput || activeElement === passwordInput) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });

        console.log('✅ Login page loaded');
        console.log('🔐 Silakan login untuk melanjutkan');
    </script>
</body>

</html>
