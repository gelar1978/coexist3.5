<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - Coexist3.5</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <h1>📝 Registrasi</h1>
            <p class="subtitle">Buat akun baru</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Pilih username">
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="email@example.com">
                </div>
                
                <div class="form-group">
                    <label>Password (min 6 karakter)</label>
                    <input type="password" id="password" required placeholder="Buat password">
                </div>
                
                <div class="form-group">
                    <label>Konfirmasi Password</label>
                    <input type="password" id="confirmPassword" required placeholder="Ulangi password">
                </div>
                
                <button type="submit" id="registerBtn">Daftar</button>
            </form>
            
            <div id="message" class="message"></div>
            
            <div class="auth-links">
                <a href="/login.html">Sudah punya akun? Login</a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageEl = document.getElementById('message');
            const btn = document.getElementById('registerBtn');
            
            messageEl.className = 'message';
            messageEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Loading...';
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, confirmPassword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageEl.className = 'message success';
                    messageEl.textContent = '✅ ' + data.message;
                    
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = '❌ ' + data.message;
                }
            } catch (err) {
                messageEl.className = 'message error';
                messageEl.textContent = '❌ Terjadi kesalahan koneksi';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Daftar';
            }
        });
    </script>
</body>
</html>
